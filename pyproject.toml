[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-layer-poc"
version = "0.3.1"
description = "Reference implementation for hash-chained AI decision receipts and Merkle checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Saqub Hussain" }
]
keywords = ["ai-assurance", "audit", "merkle-tree", "provenance", "tamper-evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Repository = "https://github.com/saqub/provenance-layer"
Issues = "https://github.com/saqub/provenance-layer/issues"

[project.scripts]
provenance-demo = "demo:main"

[tool.setuptools]
py-modules = ["ledger", "merkle", "demo"]

[tool.setuptools.data-files]
"share/doc/provenance-layer-poc" = [
  "CHANGELOG.md",
  "PROTOCOL.md",
  "SECURITY.md",
  "THREAT_MODEL.md",
]
"share/provenance-layer-poc/tests" = ["test_ledger.py"]
